version: "3.8"

services:
  tiktok-downloader:
    build: .
    container_name: tiktok-collections
    restart: unless-stopped
    volumes:
      # Mount your config file
      - ./config.json:/app/config/config.json:ro
      # Mount your downloads directory
      - ${DOWNLOAD_DIR:-./downloads}:/app/downloads
    environment:
      # Disable Python output buffering for real-time logs
      - PYTHONUNBUFFERED=1
      # TikTok session ID (required - get from browser cookies)
      - TIKTOK_SESSION_ID=${TIKTOK_SESSION_ID:-}
      # Sync interval in minutes (default: 120)
      - SYNC_INTERVAL=${SYNC_INTERVAL:-120}
      # Download directory inside container (maps to mounted volume)
      - DOWNLOAD_DIR=/app/downloads
      # Viewer port (default: 8425) - only used when ENABLE_VIEWER=true
      - VIEWER_PORT=${VIEWER_PORT:-8425}
      # Enable web viewer (default: false)
      - ENABLE_VIEWER=${ENABLE_VIEWER:-false}
    # Expose viewer port when enabled
    ports:
      - "${VIEWER_PORT:-8425}:${VIEWER_PORT:-8425}"
    # Uncomment to run specific commands instead of watch mode:
    # command: ["python", "tiktok_monitor.py", "--sync"]
