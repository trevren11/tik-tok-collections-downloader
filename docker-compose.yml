services:
  tiktok-downloader:
    # Use pre-built image from Docker Hub (recommended):
    image: trevren11/tiktok-collections-downloader:latest
    # Or build locally by uncommenting below and commenting out image above:
    # build: .
    container_name: tiktok-collections
    restart: unless-stopped
    ports:
      # Web viewer interface
      - "8425:8425"
    volumes:
      # Mount your config file
      - ./config.json:/app/config/config.json:ro
      # Mount your downloads directory
      - ${DOWNLOAD_DIR:-./downloads}:/app/downloads
    environment:
      # Disable Python output buffering for real-time logs
      - PYTHONUNBUFFERED=1
      # TikTok session ID (required - get from browser cookies)
      - TIKTOK_SESSION_ID=${TIKTOK_SESSION_ID:-}
      # Sync interval in minutes (default: 120)
      - SYNC_INTERVAL=${SYNC_INTERVAL:-120}
      # Download directory inside container (maps to mounted volume)
      - DOWNLOAD_DIR=/app/downloads
      # Set to "true" to force full sync of all collections (fetch ALL pages)
      - FULL_SYNC=${FULL_SYNC:-false}
      # Set to "true" to fetch ALL favorites on startup (one-time operation)
      - FETCH_ALL_FAVORITES=${FETCH_ALL_FAVORITES:-false}
      # Limit number of collections to sync (for testing)
      - COLLECTION_LIMIT=${COLLECTION_LIMIT:-}
      # Limit videos fetched per collection (for testing)
      - VIDEO_LIMIT=${VIDEO_LIMIT:-}
      # Maximum parallel downloads (default: 3)
      - MAX_PARALLEL=${MAX_PARALLEL:-3}
      # Limit downloads per sync cycle (for testing)
      - DOWNLOAD_LIMIT=${DOWNLOAD_LIMIT:-}
      # Viewer server port (default: 8425)
      - VIEWER_PORT=${VIEWER_PORT:-8425}
    # Uncomment to run specific commands instead of watch mode:
    # command: ["python", "tiktok_monitor.py", "--sync"]
